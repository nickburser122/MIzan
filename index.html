<style>
:root {

.badge {

.badge-success { background: var(--success-soft); color: var(--success); }

.weight-bar-track {

}

.stepper-station:first-child .stepper-line { inset-inline-start: 50%; }

.data-table-wrap {

.toast-stack {

.brand-subtitle { color:var(--ink-3); font-size:12px; margin-top:2px; }

<body>
<div id="app"></div>
<script>
var Engine = (function () {
  'use strict';

  function now() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }

  function clamp(x, lo, hi) {
    return x < lo ? lo : (x > hi ? hi : x);
  }

  function compareIds(a, b) {
    if (typeof a === 'number' && typeof b === 'number') return a - b;
    var sa = String(a), sb = String(b);
    return sa < sb ? -1 : (sa > sb ? 1 : 0);
  }

  var TASHKEEL = /[\u064B-\u0652]/g;
  var TATWEEL = /\u0640/g;
  var ARABIC_INDIC_DIGITS = '٠١٢٣٤٥٦٧٨٩';
  var EXTENDED_ARABIC_INDIC_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

  function normalizeArabic(input) {
    if (input == null) return '';
    var s = String(input);
    s = s.replace(TASHKEEL, '');
    s = s.replace(TATWEEL, '');
    s = s.replace(/[أإآٱ]/g, 'ا');
    s = s.replace(/ة/g, 'ه');
    s = s.replace(/ى/g, 'ي');
    s = s.replace(/ؤ/g, 'و');
    s = s.replace(/ئ/g, 'ي');
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      var di = ARABIC_INDIC_DIGITS.indexOf(ch);
      if (di === -1) di = EXTENDED_ARABIC_INDIC_DIGITS.indexOf(ch);
      out += di === -1 ? ch : String(di);
    }
    s = out;
    s = s.toLowerCase();
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  function stripDefiniteArticleTokens(s) {
    return s
      .split(' ')
      .map(function (tok) {
        return tok.indexOf('ال') === 0 && tok.length > 2 ? tok.slice(2) : tok;
      })
      .join(' ');
  }

  function normalizeForTierMatch(input) {
    return stripDefiniteArticleTokens(normalizeArabic(input));
  }

  function canonicalizeTierName(raw, tierNames) {
    var target = normalizeForTierMatch(raw);
    for (var i = 0; i < tierNames.length; i++) {
      if (normalizeForTierMatch(tierNames[i]) === target) return tierNames[i];
    }
    return null;
  }

  function toPiastres(egp) {
    return Math.round(egp * 100);
  }

  function fromPiastres(pi) {
    return pi / 100;
  }

  function hasOwn(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  function normalizePinnedPool(value) {
    return (value == null || value === '') ? null : value;
  }

  function effectiveWeight(person, tiers, periodDays) {
    if (person.excluded) return 0;
    var base = person.overrideValue != null ? person.overrideValue : tiers[person.tier];
    if (base == null || !isFinite(base)) return null;
    var days = (person.daysWorked == null || !isFinite(person.daysWorked)) ? periodDays : person.daysWorked;
    var attendance = clamp(days / periodDays, 0, 1);
    var penalty = clamp(person.penaltyRate == null || !isFinite(person.penaltyRate) ? 0 : person.penaltyRate, 0, 1);
    var manual = (person.manualFactor == null || !isFinite(person.manualFactor)) ? 1 : Math.max(0, person.manualFactor);
    var w = base * attendance * (1 - penalty) * manual;
    return w < 0 ? 0 : w;
  }

  function effectiveGrossPiastres(gross, roundingStep) {
    var step = roundingStep && roundingStep > 0 ? roundingStep : 1;
    return Math.round(toPiastres(gross) / step) * step;
  }

  function computePoolBudgets(pools, roundingStep) {
    var budgets = {};
    var effective = {};
    var N = 0;
    var names = Object.keys(pools);
    for (var i = 0; i < names.length; i++) {
      var name = names[i];
      var p = pools[name];
      var effPiastres = effectiveGrossPiastres(p.gross, roundingStep);
      var effGross = fromPiastres(effPiastres);
      var Np = effGross * (1 - p.taxRate);
      effective[name] = effGross;
      budgets[name] = Np;
      N += Np;
    }
    return { budgets: budgets, effectiveGross: effective, N: N, names: names };
  }

  function assignItemsToPools(items, targets, opts) {
    opts = opts || {};
    var timeBudgetMs = opts.timeBudgetMs != null ? opts.timeBudgetMs : 1500;

    var poolNames = Object.keys(targets);
    var eligiblePools = poolNames.filter(function (p) { return targets[p] > 0; });

    var assignment = {};
    var current = {};
    poolNames.forEach(function (p) { current[p] = 0; });

    var pinned = [];
    var free = [];
    items.forEach(function (it) {
      if (it.pinnedPool != null) pinned.push(it);
      else free.push(it);
    });

    pinned.forEach(function (it) {
      assignment[it.id] = it.pinnedPool;
      current[it.pinnedPool] = (current[it.pinnedPool] || 0) + it.weight;
    });

    var sortedFree = free.slice().sort(function (a, b) {
      if (b.weight !== a.weight) return b.weight - a.weight;
      return compareIds(a.id, b.id);
    });

    if (eligiblePools.length === 0) {
      sortedFree.forEach(function (it) {
        var fallback = poolNames[0] || null;
        assignment[it.id] = fallback;
        if (fallback) current[fallback] = (current[fallback] || 0) + it.weight;
      });
      return { assignment: assignment, current: current, iterations: 0, converged: true };
    }

    sortedFree.forEach(function (it) {
      var bestPool = eligiblePools[0];
      var bestDeficit = targets[bestPool] - current[bestPool];
      for (var k = 1; k < eligiblePools.length; k++) {
        var p = eligiblePools[k];
        var deficit = targets[p] - current[p];
        if (deficit > bestDeficit) {
          bestDeficit = deficit;
          bestPool = p;
        }
      }
      assignment[it.id] = bestPool;
      current[bestPool] += it.weight;
    });

    var itemById = {};
    items.forEach(function (it) { itemById[it.id] = it; });

    function objective() {
      var s = 0;
      for (var i = 0; i < poolNames.length; i++) {
        s += Math.abs(current[poolNames[i]] - targets[poolNames[i]]);
      }
      return s;
    }

    var iterations = 0;
    var converged = false;
    var timeUp = false;
    var start = now();

    var swapWindow = opts.swapWindow != null ? opts.swapWindow : 24;
    var maxPasses = opts.maxPasses != null ? opts.maxPasses : 40;

    var freeIds = sortedFree.map(function (it) { return it.id; });

    var pass = 0;
    var movedInLastPass = true;
    while (movedInLastPass && pass < maxPasses) {
      if ((now() - start) >= timeBudgetMs) { timeUp = true; break; }
      pass++;
      movedInLastPass = false;

      for (var fi = 0; fi < freeIds.length; fi++) {
        iterations++;
        var id = freeIds[fi];
        var it = itemById[id];
        var fromPool = assignment[id];
        var bestGain = 0;
        var bestPool = null;
        for (var pi = 0; pi < eligiblePools.length; pi++) {
          var toPool = eligiblePools[pi];
          if (toPool === fromPool) continue;
          var newFrom = current[fromPool] - it.weight;
          var newTo = current[toPool] + it.weight;
          var deltaFrom = Math.abs(newFrom - targets[fromPool]) - Math.abs(current[fromPool] - targets[fromPool]);
          var deltaTo = Math.abs(newTo - targets[toPool]) - Math.abs(current[toPool] - targets[toPool]);
          var delta = deltaFrom + deltaTo;
          if (delta < bestGain - 1e-9) {
            bestGain = delta;
            bestPool = toPool;
          }
        }
        if (bestPool) {
          current[fromPool] -= it.weight;
          current[bestPool] += it.weight;
          assignment[id] = bestPool;
          movedInLastPass = true;
        }
      }

      for (var a = 0; a < freeIds.length; a++) {
        var idA = freeIds[a];
        var itA = itemById[idA];
        var poolA = assignment[idA];
        var bLimit = Math.min(freeIds.length, a + 1 + swapWindow);
        for (var b = a + 1; b < bLimit; b++) {
          iterations++;
          var idB = freeIds[b];
          var itB = itemById[idB];
          var poolB = assignment[idB];
          if (poolA === poolB) continue;
          var newA = current[poolA] - itA.weight + itB.weight;
          var newB = current[poolB] - itB.weight + itA.weight;
          var oldTermA = Math.abs(current[poolA] - targets[poolA]);
          var oldTermB = Math.abs(current[poolB] - targets[poolB]);
          var newTermA = Math.abs(newA - targets[poolA]);
          var newTermB = Math.abs(newB - targets[poolB]);
          if ((newTermA + newTermB) < (oldTermA + oldTermB) - 1e-9) {
            current[poolA] = newA;
            current[poolB] = newB;
            assignment[idA] = poolB;
            assignment[idB] = poolA;
            movedInLastPass = true;
            poolA = poolB;
          }
        }
      }
    }

    converged = !movedInLastPass && !timeUp;

    return { assignment: assignment, current: current, iterations: iterations, converged: converged, timeUp: timeUp, passes: pass };
  }

  function distributePoolPiastres(grossPiastres, members) {
    var W = 0;
    for (var i = 0; i < members.length; i++) W += members[i].weight;
    if (grossPiastres === 0) {
      return members.map(function () { return 0; });
    }
    if (W <= 0) {
      throw { code: 'ZERO_WEIGHT_NONZERO_GROSS', message: 'distributePoolPiastres called with zero total weight and nonzero gross' };
    }
    var raw = members.map(function (m) { return (grossPiastres * m.weight) / W; });
    var floors = raw.map(Math.floor);
    var allocated = floors.reduce(function (a, b) { return a + b; }, 0);
    var remainder = grossPiastres - allocated;

    var order = members.map(function (m, i) {
      return { i: i, id: m.id, weight: m.weight, frac: raw[i] - floors[i] };
    });
    order.sort(function (a, b) {
      if (Math.abs(b.frac - a.frac) > 1e-9) return b.frac - a.frac;
      if (b.weight !== a.weight) return b.weight - a.weight;
      return compareIds(a.id, b.id);
    });

    var grossc = floors.slice();
    for (var k = 0; k < remainder; k++) {
      grossc[order[k].i] += 1;
    }

    var sum = grossc.reduce(function (a, b) { return a + b; }, 0);
    if (sum !== grossPiastres) {
      throw { code: 'CONSERVATION_FAILED', message: 'distributePoolPiastres: sum(grossc) !== grossPiastres', expected: grossPiastres, actual: sum };
    }
    return grossc;
  }

  function validateState(state) {
    var errors = [];
    var pools = state.pools || {};
    var poolNames = Object.keys(pools);
    poolNames.forEach(function (name) {
      var p = pools[name];
      if (!(p.taxRate >= 0 && p.taxRate < 1)) {
        errors.push({ code: 'BAD_TAX_RATE', poolName: name, message: 'نسبة الخصم لمجمع "' + name + '" يجب أن تكون بين 0 و 1' });
      }
      if (!(p.gross >= 0)) {
        errors.push({ code: 'BAD_GROSS', poolName: name, message: 'إجمالي مجمع "' + name + '" لا يمكن أن يكون سالبًا' });
      }
    });
    if (!(state.periodDays >= 1)) {
      errors.push({ code: 'BAD_PERIOD_DAYS', message: 'عدد أيام الفترة يجب أن يكون 1 على الأقل' });
    }
    (state.people || []).forEach(function (person) {
      var pinned = normalizePinnedPool(person.pinnedPool);
      if (pinned != null && !hasOwn(pools, pinned)) {
        errors.push({ code: 'UNKNOWN_PINNED_POOL', personId: person.id, poolName: pinned, message: 'المجمع المقفول "' + pinned + '" غير موجود لـ "' + (person.name || person.id) + '"' });
      }
      if (person.tier == null || (state.tiers && !hasOwn(state.tiers, person.tier) && person.overrideValue == null)) {
        errors.push({ code: 'UNRESOLVED_TIER', personId: person.id, message: 'الفئة غير معروفة لـ "' + (person.name || person.id) + '"' });
      }
    });
    return errors;
  }

  function collectRowWarnings(state) {
    var warnings = [];
    var periodDays = state.periodDays;
    (state.people || []).forEach(function (person) {
      var label = person.name || ('صف ' + person.id);
      if (!person.name || !String(person.name).trim()) {
        warnings.push({ code: 'MISSING_NAME', personId: person.id, message: 'صف بدون اسم (رقم ' + person.id + ')' });
      }
      if (person.penaltyRate != null && !(person.penaltyRate >= 0 && person.penaltyRate <= 1)) {
        warnings.push({ code: 'BAD_PENALTY', personId: person.id, message: 'نسبة الجزاء خارج النطاق لـ "' + label + '" — تم تثبيتها داخل النطاق 0–1' });
      }
      if (person.daysWorked != null && !(person.daysWorked >= 0 && person.daysWorked <= periodDays)) {
        warnings.push({ code: 'BAD_DAYS', personId: person.id, message: 'أيام العمل خارج نطاق الفترة لـ "' + label + '" — تم تثبيتها داخل النطاق 0–' + periodDays });
      }
      if (person.manualFactor != null && !(person.manualFactor >= 0)) {
        warnings.push({ code: 'BAD_MANUAL_FACTOR', personId: person.id, message: 'المعامل اليدوي غير صالح لـ "' + label + '" — تم استخدام 1' });
      }
    });
    return warnings;
  }

  function runPipeline(state) {
    var validationErrors = validateState(state);
    if (validationErrors.length > 0) {
      return { ok: false, errors: validationErrors };
    }

    try {
    var t0 = now();
    var tiers = state.tiers || {};
    var pools = state.pools || {};
    var periodDays = state.periodDays;
    var roundingStep = state.options && state.options.roundingStep ? state.options.roundingStep : 1;
    var warnings = collectRowWarnings(state);

    var budgetInfo = computePoolBudgets(pools, roundingStep);
    var N = budgetInfo.N;
    var poolNames = budgetInfo.names;

    var people = state.people || [];
    var weighted = [];
    for (var i = 0; i < people.length; i++) {
      var person = people[i];
      var w = effectiveWeight(person, tiers, periodDays);
      if (w == null) {
        return { ok: false, errors: [{ code: 'UNRESOLVED_TIER', personId: person.id, message: 'تعذر حساب الوزن لـ "' + person.name + '"' }] };
      }
      weighted.push({ person: person, weight: w });
    }

    var participating = weighted.filter(function (x) { return x.weight > 0; });
    var W = participating.reduce(function (s, x) { return s + x.weight; }, 0);

    var k = W > 0 ? N / W : 0;

    var targets = {};
    poolNames.forEach(function (name) {
      targets[name] = (W > 0 && N > 0) ? (W * budgetInfo.budgets[name] / N) : 0;
    });

    var assignItems = participating.map(function (x) {
      return { id: x.person.id, weight: x.weight, pinnedPool: normalizePinnedPool(x.person.pinnedPool) };
    });

    var assignResult = assignItemsToPools(assignItems, targets, {});
    var assignment = assignResult.assignment;

    var membersByPool = {};
    poolNames.forEach(function (name) { membersByPool[name] = []; });
    for (var ai = 0; ai < participating.length; ai++) {
      var px = participating[ai];
      var assignedPool = assignment[px.person.id];
      if (assignedPool == null) continue;
      if (!hasOwn(membersByPool, assignedPool)) {
        return { ok: false, errors: [{ code: 'UNKNOWN_PINNED_POOL', personId: px.person.id, poolName: assignedPool, message: 'المجمع المقفول "' + assignedPool + '" غير موجود لـ "' + (px.person.name || px.person.id) + '"' }] };
      }
      membersByPool[assignedPool].push({ id: px.person.id, weight: px.weight });
    }

    for (var pn = 0; pn < poolNames.length; pn++) {
      var name = poolNames[pn];
      if (budgetInfo.effectiveGross[name] > 0 && membersByPool[name].length === 0) {
        return { ok: false, errors: [{ code: 'EMPTY_POOL_WITH_BUDGET', poolName: name, message: 'مجمع "' + name + '" لديه مبلغ ولكن لا يوجد أي مستحق فيه' }] };
      }
    }

    var stepUnit = roundingStep;
    var poolResults = {};
    var peopleResultsById = {};

    for (var pj = 0; pj < poolNames.length; pj++) {
      var poolName = poolNames[pj];
      var poolDef = pools[poolName];
      var members = membersByPool[poolName];
      var actualWeight = members.reduce(function (s, m) { return s + m.weight; }, 0);
      var effGrossPiastres = effectiveGrossPiastres(poolDef.gross, stepUnit);
      var grossStepTotal = Math.round(effGrossPiastres / stepUnit);

      var grossStepPerMember = [];
      if (members.length > 0) {
        grossStepPerMember = distributePoolPiastres(grossStepTotal, members);
      }

      var targetWeight = targets[poolName];
      var deviation = actualWeight > 0 ? (targetWeight / actualWeight - 1) : null;
      var zeroBudgetWithMembers = effGrossPiastres === 0 && members.length > 0;

      poolResults[poolName] = {
        gross: poolDef.gross,
        effectiveGross: budgetInfo.effectiveGross[poolName],
        effectiveGrossPiastres: effGrossPiastres,
        roundingAdjusted: effGrossPiastres !== toPiastres(poolDef.gross),
        taxRate: poolDef.taxRate,
        net: budgetInfo.budgets[poolName],
        targetWeight: targetWeight,
        actualWeight: actualWeight,
        deviation: deviation,
        zeroBudgetWithMembers: zeroBudgetWithMembers,
        memberCount: members.length
      };

      if (poolResults[poolName].roundingAdjusted) {
        warnings.push({
          code: 'POOL_ROUNDED',
          poolName: poolName,
          message: 'تم تعديل إجمالي المجمع من ' + fromPiastres(toPiastres(poolDef.gross)).toFixed(2) + ' إلى ' + fromPiastres(effGrossPiastres).toFixed(2) + ' ليناسب التقريب'
        });
      }
      if (zeroBudgetWithMembers) {
        warnings.push({
          code: 'ZERO_BUDGET_POOL',
          poolName: poolName,
          message: 'مجمع "' + poolName + '" بلا مبلغ — الأعضاء المثبّتون لن يحصلوا على شيء'
        });
      }

      for (var mi = 0; mi < members.length; mi++) {
        var grossPiastres = grossStepPerMember[mi] * stepUnit;
        var taxPiastres = Math.round(grossPiastres * poolDef.taxRate);
        var netPiastres = grossPiastres - taxPiastres;
        var shareOfPoolWeight = actualWeight > 0 ? members[mi].weight / actualWeight : 0;
        var idealNetEGP = k * members[mi].weight;

        peopleResultsById[members[mi].id] = {
          id: members[mi].id,
          pool: poolName,
          weight: members[mi].weight,
          shareOfPoolWeight: shareOfPoolWeight,
          grossPiastres: grossPiastres,
          taxPiastres: taxPiastres,
          netPiastres: netPiastres,
          idealNetEGP: idealNetEGP
        };
      }
    }

    var excludedResults = weighted
      .filter(function (x) { return x.weight === 0; })
      .map(function (x) {
        return {
          id: x.person.id,
          pool: null,
          weight: 0,
          shareOfPoolWeight: 0,
          grossPiastres: 0,
          taxPiastres: 0,
          netPiastres: 0,
          idealNetEGP: 0
        };
      });

    excludedResults.forEach(function (r) { peopleResultsById[r.id] = r; });

    var orderedPeople = people.map(function (person) {
      return peopleResultsById[person.id] || {
        id: person.id, pool: null, weight: 0, shareOfPoolWeight: 0,
        grossPiastres: 0, taxPiastres: 0, netPiastres: 0, idealNetEGP: 0
      };
    });

    var t1 = now();

    return {
      ok: true,
      k: k,
      W: W,
      N: N,
      poolResults: poolResults,
      people: orderedPeople,
      assignment: assignment,
      warnings: warnings,
      meta: { timingMs: t1 - t0 }
    };
    } catch (e) {
      return {
        ok: false,
        errors: [{
          code: (e && e.code) || 'INTERNAL_ERROR',
          message: (e && e.message) || 'خطأ داخلي غير متوقع في محرك الحساب',
          detail: e
        }]
      };
    }
  }

  return {
    normalizeArabic: normalizeArabic,
    normalizeForTierMatch: normalizeForTierMatch,
    canonicalizeTierName: canonicalizeTierName,
    toPiastres: toPiastres,
    fromPiastres: fromPiastres,
    effectiveWeight: effectiveWeight,
    effectiveGrossPiastres: effectiveGrossPiastres,
    computePoolBudgets: computePoolBudgets,
    assignItemsToPools: assignItemsToPools,
    distributePoolPiastres: distributePoolPiastres,
    validateState: validateState,
    collectRowWarnings: collectRowWarnings,
    normalizePinnedPool: normalizePinnedPool,
    runPipeline: runPipeline,
    clamp: clamp,
    compareIds: compareIds,
    hasOwn: hasOwn
  };
})();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = Engine;
}

<script>
var SelfTest = (function () {
  'use strict';

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function approxEqual(a, b, eps) {
    return Math.abs(a - b) <= (eps == null ? 1e-6 : eps);
  }

  var DEFAULT_TIERS = {
    'مدير إدارة': 979, 'مدير': 750, 'رئيس قسم': 534, 'عضو مميز': 494,
    'شهادة عليا': 445, 'فوق متوسط': 400, 'متوسط': 356, 'معاون خدمة': 303
  };

  function defaultPools() {
    return {
      'طوابع المواليد': { gross: 100000, taxRate: 0.11 },
      'طوابع اللجان الطبية': { gross: 80000, taxRate: 0.240938 },
      'نماذج استمارات 111': { gross: 60000, taxRate: 0.240938 }
    };
  }

  function makePerson(id, name, tier, extra) {
    var p = { id: id, name: name, tier: tier, overrideValue: null, daysWorked: null, penaltyRate: null, pinnedPool: null, excluded: false, manualFactor: null };
    if (extra) for (var k in extra) p[k] = extra[k];
    return p;
  }

  function run() {
    var results = [];
    function record(name, pass, detail) {
      results.push({ name: name, pass: pass, detail: detail || '' });
    }

    (function T1_conservation() {
      var rng = mulberry32(42);
      var tierValues = [979, 303];
      var scenarios = 200;
      var allOk = true;
      var errDetail = '';
      var errorCount = 0, successCount = 0;
      for (var s = 0; s < scenarios; s++) {
        var n = 4 + Math.floor(rng() * 20);
        var people = [];
        for (var i = 0; i < n; i++) {
          var tv = tierValues[Math.floor(rng() * tierValues.length)];
          var tierName = tv === 979 ? 'مدير إدارة' : 'معاون خدمة';
          people.push(makePerson(i, 'شخص ' + i, tierName));
        }
        var pools = {
          'طوابع المواليد': { gross: Math.round((5000 + rng() * 95000) * 100) / 100 + 0.03, taxRate: 0.11 },
          'طوابع اللجان الطبية': { gross: Math.round((5000 + rng() * 95000) * 100) / 100 + 0.07, taxRate: 0.240938 },
          'نماذج استمارات 111': { gross: Math.round((5000 + rng() * 95000) * 100) / 100 + 0.01, taxRate: 0.240938 }
        };
        var state = { people: people, tiers: DEFAULT_TIERS, pools: pools, periodDays: 30, options: { roundingStep: 1 } };
        var res = Engine.runPipeline(state);
        if (!res.ok) {
          errorCount++;
          var onlyEmptyPoolErrors = res.errors.every(function (e) { return e.code === 'EMPTY_POOL_WITH_BUDGET'; });
          if (!onlyEmptyPoolErrors) {
            allOk = false;
            errDetail = 'scenario ' + s + ' failed unexpectedly: ' + JSON.stringify(res.errors);
          }
          continue;
        }
        successCount++;
        Object.keys(pools).forEach(function (poolName) {
          var expectedPiastres = Engine.toPiastres(pools[poolName].gross);
          var actualPiastres = res.people
            .filter(function (p) { return p.pool === poolName; })
            .reduce(function (sum, p) { return sum + p.grossPiastres; }, 0);
          if (actualPiastres !== expectedPiastres) {
            allOk = false;
            errDetail = 'scenario ' + s + ' pool ' + poolName + ': expected ' + expectedPiastres + ' got ' + actualPiastres;
          }
        });
      }
      record('T1 — الحفاظ على القيمة (200 سيناريو عشوائي)', allOk, allOk ? (successCount + ' نجح، ' + errorCount + ' رفض بشكل صحيح (مجمع فارغ)') : errDetail);
    })();

    (function T2_proportionality() {
      var people = [
        makePerson(1, 'أ', 'مدير إدارة'),
        makePerson(2, 'ب', 'مدير إدارة'),
        makePerson(3, 'ج', 'رئيس قسم'),
        makePerson(4, 'د', 'معاون خدمة')
      ];
      var pools = {
        'طوابع المواليد': { gross: 50000, taxRate: 0.11 },
        'طوابع اللجان الطبية': { gross: 0, taxRate: 0.240938 },
        'نماذج استمارات 111': { gross: 0, taxRate: 0.240938 }
      };
      var state = { people: people, tiers: DEFAULT_TIERS, pools: pools, periodDays: 30, options: {} };
      var res = Engine.runPipeline(state);
      var pass = res.ok;
      var detail = '';
      if (res.ok) {
        var byId = {};
        res.people.forEach(function (p) { byId[p.id] = p; });
        var wi = DEFAULT_TIERS['مدير إدارة'], wj = DEFAULT_TIERS['رئيس قسم'];
        var ni = byId[1].netPiastres, nj = byId[3].netPiastres;
        var expectedRatio = wi / wj;
        var actualRatio = ni / nj;
        pass = approxEqual(expectedRatio, actualRatio, 0.01);
        detail = 'النسبة المتوقعة ' + expectedRatio.toFixed(4) + ' الفعلية ' + actualRatio.toFixed(4);
      } else {
        detail = JSON.stringify(res.errors);
      }
      record('T2 — التناسب داخل مجمع واحد', pass, detail);
    })();

    (function T3_crossPoolFairness() {
      var taxA = 0.11, taxB = 0.240938;
      var Ntarget = 8900;
      var grossA = Ntarget / (1 - taxA);
      var grossB = Ntarget / (1 - taxB);
      var people = [
        makePerson(1, 'أ1', 'مدير إدارة', { pinnedPool: 'طوابع المواليد' }),
        makePerson(2, 'أ2', 'مدير إدارة', { pinnedPool: 'طوابع المواليد' }),
        makePerson(3, 'ب1', 'مدير إدارة', { pinnedPool: 'طوابع اللجان الطبية' }),
        makePerson(4, 'ب2', 'مدير إدارة', { pinnedPool: 'طوابع اللجان الطبية' })
      ];
      var pools = {
        'طوابع المواليد': { gross: grossA, taxRate: taxA },
        'طوابع اللجان الطبية': { gross: grossB, taxRate: taxB },
        'نماذج استمارات 111': { gross: 0, taxRate: 0.240938 }
      };
      var state = { people: people, tiers: DEFAULT_TIERS, pools: pools, periodDays: 30, options: {} };
      var res = Engine.runPipeline(state);
      var pass = res.ok;
      var detail = '';
      if (res.ok) {
        var nets = res.people.map(function (p) { return p.netPiastres; });
        var maxDiff = Math.max.apply(null, nets) - Math.min.apply(null, nets);
        pass = maxDiff <= 1;
        detail = 'صافي (قرش)=' + JSON.stringify(nets) + ' أقصى فرق=' + maxDiff;
      } else {
        detail = JSON.stringify(res.errors);
      }
      record('T3 — العدالة بين المجمعات (تقسيم دقيق)', pass, detail);
    })();

    (function T4_realExample() {
      var people = [
        makePerson(1, 'شخص1', 'مدير إدارة', { pinnedPool: 'طوابع المواليد' }),
        makePerson(2, 'شخص2', 'مدير إدارة', { pinnedPool: 'طوابع اللجان الطبية' })
      ];
      var pools = {
        'طوابع المواليد': { gross: 2390, taxRate: 0.11 },
        'طوابع اللجان الطبية': { gross: 2800, taxRate: 0.240938 },
        'نماذج استمارات 111': { gross: 0, taxRate: 0.240938 }
      };
      var state = { people: people, tiers: DEFAULT_TIERS, pools: pools, periodDays: 30, options: {} };
      var res = Engine.runPipeline(state);
      var pass = res.ok;
      var detail = '';
      if (res.ok) {
        var byId = {};
        res.people.forEach(function (p) { byId[p.id] = p; });
        var net1 = Engine.fromPiastres(byId[1].netPiastres);
        var net2 = Engine.fromPiastres(byId[2].netPiastres);
        pass = approxEqual(net1, 2127.10, 0.005) && approxEqual(net2, 2125.37, 0.005);
        detail = 'net1=' + net1.toFixed(2) + ' (المتوقع 2127.10)  net2=' + net2.toFixed(2) + ' (المتوقع 2125.37)';
      } else {
        detail = JSON.stringify(res.errors);
      }
      record('T4 — إعادة إنتاج مثال العميل الحقيقي', pass, detail);
    })();

    (function T5_penalty() {
      var people = [
        makePerson(1, 'بدون جزاء', 'مدير', { pinnedPool: 'طوابع المواليد' }),
        makePerson(2, 'بجزاء 50%', 'مدير', { pinnedPool: 'طوابع المواليد', penaltyRate: 0.5 })
      ];
      var pools = {
        'طوابع المواليد': { gross: 10000, taxRate: 0.11 },
        'طوابع اللجان الطبية': { gross: 0, taxRate: 0.240938 },
        'نماذج استمارات 111': { gross: 0, taxRate: 0.240938 }
      };
      var state = { people: people, tiers: DEFAULT_TIERS, pools: pools, periodDays: 30, options: {} };
      var res = Engine.runPipeline(state);
      var pass = res.ok;
      var detail = '';
      if (res.ok) {
        var byId = {};
        res.people.forEach(function (p) { byId[p.id] = p; });
        var full = byId[1].netPiastres;
        var half = byId[2].netPiastres;
        pass = Math.abs(half - full / 2) <= 1;
        var poolExact = (byId[1].grossPiastres + byId[2].grossPiastres) === Engine.toPiastres(10000);
        pass = pass && poolExact;
        detail = 'كامل=' + full + ' نصف=' + half + ' (متوقع ~' + (full / 2) + ')، دقة المجمع=' + poolExact;
      } else {
        detail = JSON.stringify(res.errors);
      }
      record('T5 — الجزاء يُنصّف الصافي، والمجمع يبقى دقيقًا', pass, detail);
    })();

    (function T6_attendance() {
      var w = Engine.effectiveWeight(makePerson(1, 'x', 'مدير', { daysWorked: 15 }), DEFAULT_TIERS, 30);
      var wFull = Engine.effectiveWeight(makePerson(2, 'y', 'مدير', { daysWorked: 30 }), DEFAULT_TIERS, 30);

    (function T7_excluded() {
      var people = [
        makePerson(1, 'مستبعد', 'مدير إدارة', { excluded: true }),
        makePerson(2, 'عادي', 'مدير إدارة')

      };
      var state = { people: people, tiers: DEFAULT_TIERS, pools: pools, periodDays: 30, options: {} };
      var res = Engine.runPipeline(state);

      var detail = '';
      if (res.ok) {

    (function T8_emptyPool() {

    (function T9_zeroWeight() {

        makePerson(1, 'مستبعد1', 'مدير إدارة', { excluded: true }),

      ];

    (function T10_determinism() {
      var rng = mulberry32(7);
      var people = [];
      var tierNames = Object.keys(DEFAULT_TIERS);
      for (var i = 0; i < 300; i++) {
        var tierName = tierNames[Math.floor(rng() * tierNames.length)];

        }));

      var res1 = Engine.runPipeline(JSON.parse(JSON.stringify(state)));
      var res2 = Engine.runPipeline(JSON.parse(JSON.stringify(state)));

      var s1 = JSON.stringify(res1);

      record('T10 — الحتمية (300 شخص، تشغيلتان متطابقتان)', s1 === s2, s1 === s2 ? 'متطابق تمامًا' : 'اختلاف!');
    })();

    (function T11_performance() {
      var rng = mulberry32(99);
      var people = [];
      var tierNames = Object.keys(DEFAULT_TIERS);
      var N = 100000;
      for (var i = 0; i < N; i++) {
        var tierName = tierNames[Math.floor(rng() * tierNames.length)];
        people.push(makePerson(i, 'شخص ' + i, tierName, {
          daysWorked: 20 + Math.floor(rng() * 10)
        }));
      }
      var pools = {

      };

      var start = (typeof performance !== 'undefined' ? performance.now() : Date.now());
      var res = Engine.runPipeline(state);
      var elapsed = (typeof performance !== 'undefined' ? performance.now() : Date.now()) - start;
      var pass = res.ok && elapsed < 3000;

    (function T12_arabicNormalization() {
      var tierNames = Object.keys(DEFAULT_TIERS);

    (function T13_largestRemainderEdge() {
      var members = [{ id: 1, weight: 1 }, { id: 2, weight: 1 }, { id: 3, weight: 1 }];

      record('T13 — حالة حرجة لطريقة أكبر باقٍ (تقسيم 100.00 على 3)', pass, JSON.stringify(egp));

    (function T14_filterSafetyDemo() {
      var people = [
        makePerson(1, 'قسم أ - شخص', 'مدير إدارة', { dept: 'أ' }),
        makePerson(2, 'قسم ب - شخص', 'معاون خدمة', { dept: 'ب' })
      ];

      };

      var resDeptA = Engine.runPipeline(stateDeptAOnly);
      var fullNet = resFull.ok ? resFull.people.find(function (p) { return p.id === 1; }).netPiastres : null;
      var filteredNet = resDeptA.ok ? resDeptA.people.find(function (p) { return p.id === 1; }).netPiastres : null;
      var divergent = fullNet !== filteredNet;
      record('T14 — إثبات خطورة إعادة الحساب عند الفلترة', divergent,

        '  (الاختلاف يثبت أن الواجهة يجب أن تحسب مرة واحدة فقط وتُصفّي النتيجة المخزنة)');
    })();

    (function T15_allocationQuality() {
      var rng = mulberry32(123);
      var people = [];
      var tierNames = Object.keys(DEFAULT_TIERS);
      for (var i = 0; i < 500; i++) {
        var tierName = tierNames[Math.floor(rng() * tierNames.length)];

      }

      var detail = '';
      if (res.ok) {
        Object.keys(res.poolResults).forEach(function (name) {
          var d = res.poolResults[name].deviation;
          if (d != null) maxDev = Math.max(maxDev, Math.abs(d));
        });
        pass = maxDev < 0.01;
        detail = 'أقصى انحراف=' + (maxDev * 100).toFixed(3) + '% (الحد 1%)';
      } else {
        detail = JSON.stringify(res.errors);
      }
      record('T15 — جودة التوزيع (500 شخص، انحراف أقل من 1%)', pass, detail);
    })();

    (function T16_locksNeverMove() {
      var rng = mulberry32(55);
      var people = [];
      var tierNames = Object.keys(DEFAULT_TIERS);
      for (var i = 0; i < 100; i++) {
        var tierName = tierNames[Math.floor(rng() * tierNames.length)];
        var extra = {};
        if (i < 10) extra.pinnedPool = 'نماذج استمارات 111';
        people.push(makePerson(i, 'شخص ' + i, tierName, extra));
      }
      var state = { people: people, tiers: DEFAULT_TIERS, pools: defaultPools(), periodDays: 30, options: {} };
      var res = Engine.runPipeline(state);
      var pass = res.ok;
      var detail = '';

        var byId = {};
        res.people.forEach(function (p) { byId[p.id] = p; });
        var allPinned = true;
        for (var i = 0; i < 10; i++) {
          if (byId[i].pool !== 'نماذج استمارات 111') allPinned = false;
        }
        pass = allPinned;
        detail = allPinned ? 'كل الأشخاص العشرة المثبّتين بقوا في مجمعهم' : 'شخص مثبّت تحرك';
      } else {
        detail = JSON.stringify(res.errors);
      }
      record('T16 — التثبيت اليدوي (الأشخاص المثبّتون لا يتحركون أبدًا)', pass, detail);
    })();

    (function T17_roundingConservation() {
      var rng = mulberry32(2024);
      var steps = [1, 100];
      var tierNames = Object.keys(DEFAULT_TIERS);
      var allOk = true;
      var detail = '';
      var checked = 0;
      for (var si = 0; si < steps.length; si++) {
        var step = steps[si];
        for (var s = 0; s < 100; s++) {
          var n = 4 + Math.floor(rng() * 20);
          var people = [];
          for (var i = 0; i < n; i++) {
            people.push(makePerson(i, 'شخص ' + i, tierNames[Math.floor(rng() * tierNames.length)]));
          }
          var pools = {
            'طوابع المواليد': { gross: Math.round((5000 + rng() * 95000) * 100) / 100 + 0.37, taxRate: 0.11 },
            'طوابع اللجان الطبية': { gross: Math.round((5000 + rng() * 95000) * 100) / 100 + 0.55, taxRate: 0.240938 },
            'نماذج استمارات 111': { gross: Math.round((5000 + rng() * 95000) * 100) / 100 + 0.99, taxRate: 0.240938 }
          };
          var state = { people: people, tiers: DEFAULT_TIERS, pools: pools, periodDays: 30, options: { roundingStep: step } };
          var res = Engine.runPipeline(state);
          if (!res.ok) {
            if (!res.errors.every(function (e) { return e.code === 'EMPTY_POOL_WITH_BUDGET'; })) {
              allOk = false;
              detail = 'رفض غير متوقع: ' + JSON.stringify(res.errors);
            }
            continue;
          }
          checked++;
          (function (currentStep, currentPools, currentRes) {
            Object.keys(currentPools).forEach(function (poolName) {
              var expected = Engine.effectiveGrossPiastres(currentPools[poolName].gross, currentStep);
              var actual = currentRes.people
                .filter(function (p) { return p.pool === poolName; })
                .reduce(function (sum, p) { return sum + p.grossPiastres; }, 0);
              if (actual !== expected) {
                allOk = false;
                detail = 'وحدة=' + currentStep + ' ' + poolName + ': متوقع ' + expected + ' فعلي ' + actual;
              }
              if (currentStep === 100 && actual % 100 !== 0) {
                allOk = false;
                detail = 'وحدة=100 لكن الإجمالي ليس مضاعفًا للجنيه: ' + actual;
              }
            });
          })(step, pools, res);
        }
      }
      record('T17 — الحفاظ على القيمة مع التقريب (قرش وجنيه، 200 سيناريو)', allOk, allOk ? (checked + ' سيناريو تحقق بالضبط') : detail);
    })();

    (function T18_unknownPinnedPool() {
      var badState = {
        people: [
          makePerson(1, 'مقفول على مجمع وهمي', 'مدير إدارة', { pinnedPool: 'تلقائي' }),
          makePerson(2, 'عادي', 'مدير')
        ],
        tiers: DEFAULT_TIERS, pools: defaultPools(), periodDays: 30, options: {}
      };
      var res = Engine.runPipeline(badState);
      var named = res.ok === false && res.errors.some(function (e) { return e.code === 'UNKNOWN_PINNED_POOL'; });
      var noCrash = res.ok === false && !res.errors.some(function (e) { return e.code === 'INTERNAL_ERROR'; });
      var emptyState = {
        people: [makePerson(1, 'أ', 'مدير', { pinnedPool: '' })],
        tiers: DEFAULT_TIERS,
        pools: { 'طوابع المواليد': { gross: 1000, taxRate: 0.11 } },
        periodDays: 30, options: {}
      };
      var emptyTreatedAsAuto = Engine.runPipeline(emptyState).ok === true;
      record('T18 — مجمع مقفول غير معروف ← خطأ مُسمّى بلا انهيار', named && noCrash && emptyTreatedAsAuto,
        'خطأ مُسمّى=' + named + '، بلا INTERNAL_ERROR=' + noCrash + '، القيمة الفارغة تُعامل كتلقائي=' + emptyTreatedAsAuto);
    })();

    (function T19_exportIndependentOfFilters() {
      if (typeof App === 'undefined' || !App.internals) {
        record('T19 — الإجماليات الرسمية لا تتأثر بالفلاتر', false, 'App.internals غير متاح');
        return;
      }
      var api = App.internals;
      var exportPathSource = String(api.exportReport) + String(api.detailRows) + String(api.executiveRows) + String(api.specialCasePeople);
      var grepClean = exportPathSource.indexOf('filteredPeople') < 0;

      var tierNames = Object.keys(DEFAULT_TIERS);
      var depts = ['أ', 'ب', 'ج'];
      var people = [];
      for (var i = 0; i < 40; i++) {
        var person = makePerson(i + 1, 'شخص ' + i, tierNames[i % tierNames.length]);
        person.dept = depts[i % depts.length];
        person.job = 'وظيفة';
        people.push(person);
      }
      var probe = {
        screen: 5, title: 'اختبار', period: 'فترة', periodDays: 30,
        tiers: DEFAULT_TIERS, pools: defaultPools(), options: { roundingStep: 1 },
        people: people, rawRows: [], headers: [], mapping: {}, tierMappings: {},
        fileName: '', result: null,
        filters: { search: '', dept: '', tier: '', pool: '', special: false, excluded: false },
        history: []
      };
      var saved = api.getState();
      api.setState(probe);
      api.recompute();
      var unfilteredExport = JSON.stringify(api.detailRows(probe.people)) + '|' + JSON.stringify(api.executiveRows()) + '|' + JSON.stringify(api.detailRows(api.specialCasePeople()));
      var unfilteredView = api.filteredPeople().length;
      probe.filters.dept = 'ب';
      probe.filters.tier = tierNames[1];
      var filteredView = api.filteredPeople().length;
      var filteredExport = JSON.stringify(api.detailRows(probe.people)) + '|' + JSON.stringify(api.executiveRows()) + '|' + JSON.stringify(api.detailRows(api.specialCasePeople()));
      var recomputeCount = probe.__recomputeCount;
      api.setState(saved);

      var identical = unfilteredExport === filteredExport;
      var viewNarrowed = filteredView < unfilteredView;
      record('T19 — الإجماليات الرسمية لا تتأثر بالفلاتر', identical && grepClean && viewNarrowed,
        'التصدير متطابق=' + identical + '، بلا filteredPeople في مسار التصدير=' + grepClean +
        '، العرض يتقلّص (' + unfilteredView + ' ← ' + filteredView + ')=' + viewNarrowed +
        '، عدد إعادة الحساب=' + recomputeCount);
    })();

    return results;
  }

  function renderInto(container) {
    var results = run();
    var passCount = results.filter(function (r) { return r.pass; }).length;

    var wrap = document.createElement('div');
    wrap.className = 'selftest-wrap';

    var heading = document.createElement('h1');
    heading.className = 'selftest-heading';
    heading.textContent = 'اختبارات محرك الحساب الذاتية';
    wrap.appendChild(heading);

    var summary = document.createElement('div');
    summary.className = 'selftest-summary ' + (passCount === results.length ? 'selftest-summary-ok' : 'selftest-summary-bad');
    summary.textContent = passCount + ' / ' + results.length + ' اختبارًا ناجحًا';
    wrap.appendChild(summary);

    var build = document.createElement('div');
    build.className = 'selftest-detail';
    build.style.marginBottom = '20px';
    build.textContent = (typeof APP_NAME === 'string' ? APP_NAME + ' ' + APP_NAME_LATIN : 'ميزان Mizan') + ' — ' + (typeof APP_VERSION === 'string' ? APP_VERSION : 'dev');
    wrap.appendChild(build);

    var table = document.createElement('div');
    table.className = 'selftest-table';
    results.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'selftest-row ' + (r.pass ? 'selftest-row-pass' : 'selftest-row-fail');

      var badge = document.createElement('div');
      badge.className = 'selftest-badge';
      badge.textContent = r.pass ? 'نجاح' : 'فشل';
      row.appendChild(badge);

      var body = document.createElement('div');
      body.className = 'selftest-body';

      var name = document.createElement('div');
      name.className = 'selftest-name';
      name.textContent = r.name;
      body.appendChild(name);

      var detail = document.createElement('div');
      detail.className = 'selftest-detail';
      detail.textContent = r.detail;
      body.appendChild(detail);

      row.appendChild(body);
      table.appendChild(row);
    });
    wrap.appendChild(table);

    container.innerHTML = '';
    container.appendChild(wrap);
  }

  return { run: run, renderInto: renderInto };
})();

<script>
var APP_NAME = 'ميزان';
var APP_NAME_LATIN = 'Mizan';
var APP_VERSION = '1.0.0';

var App = (function () {
  'use strict';
  var STATIONS = ['رفع الملف', 'ربط الأعمدة', 'المبالغ والفترة', 'التوزيع', 'لوحة المعلومات', 'التصدير'];
  var state;
  var container;
  var toastContainer;
  var importing = false;
  var sortKey = null;
  var sortDir = 1;

  function el(tag, className, children) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    (children || []).forEach(function (child) { if (child != null) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child); });
    return node;
  }

  function num(text) {
    var s = el('span', 'num');
    s.setAttribute('dir', 'ltr');
    s.textContent = text;
    return s;
  }

  function debounce(fn, wait) {
    var timer;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  function sanitizeFilename(name) {
    return String(name || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim() || 'ملف';
  }

  function formatEGP(value, decimals) {
    var d = decimals == null ? 2 : decimals;
    return new Intl.NumberFormat('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }).format(Number(value) || 0);
  }

  function formatPercent(value, decimals) {
    var d = decimals == null ? 2 : decimals;
    return formatEGP((Number(value) || 0) * 100, d) + '%';
  }

  function parseNumber(value) {
    if (value == null || String(value).trim() === '') return null;
    var s = String(value).replace(/[٠-٩]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); }).replace(/[۰-۹]/g, function (c) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(c); }).replace(/,/g, '').replace(/٪/g, '%').trim();
    var percent = s.indexOf('%') >= 0;
    var n = Number(s.replace('%', ''));
    if (!isFinite(n)) return null;
    return percent ? n / 100 : n;
  }

  function iconEl(name) {
    var span = document.createElement('span');
    span.innerHTML = Icons.svg(name);
    return span.firstChild;
  }

  function showToast(message) {
    if (!toastContainer) { toastContainer = el('div', 'toast-stack'); document.body.appendChild(toastContainer); }
    var toast = el('div', 'toast', [message]);
    toastContainer.appendChild(toast);
    setTimeout(function () { toast.style.opacity = '0'; setTimeout(function () { toast.remove(); }, 220); }, 3600);
  }

  function clone(value) { return JSON.parse(JSON.stringify(value)); }

  function defaultSettings() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('incentiveSettings') || 'null'); } catch (e) { saved = null; }
    return saved && saved.tiers && saved.pools ? saved : { tiers: clone(DemoData.TIERS), pools: clone(DemoData.POOLS), roundingStep: 1 };
  }

  function makeInitialState() {
    var settings = defaultSettings();
    return {
      screen: 0,
      title: 'توزيع الحوافز',
      period: 'أغسطس 2026',
      periodDays: 30,
      tiers: settings.tiers,
      pools: settings.pools,
      options: { roundingStep: settings.roundingStep || 1 },
      people: [],
      rawRows: [],
      headers: [],
      mapping: { name: '', job: '', dept: '', tier: '', daysWorked: '', penaltyRate: '', pinnedPool: '', excluded: '', overrideValue: '', manualFactor: '' },
      tierMappings: {},
      fileName: '',
      result: null,
      filters: { search: '', dept: '', tier: '', pool: '', special: false, excluded: false },
      history: []
    };
  }

  function normalizeHeader(header) {
    return Engine.normalizeArabic(header || '').replace(/[^\u0600-\u06FFa-z0-9]/g, '');
  }

  function autoMapping(headers) {

    generalPanel.appendChild(generalGrid); generalPanel.appendChild(el('div', 'settings-note', ['تصفية لوحة المعلومات لا تعيد تشغيل المحرك؛ فهي تغيّر العرض فقط وتحافظ على نفس المبالغ المحسوبة.'])); panels.general = generalPanel; modal.appendChild(generalPanel);
    activate('tiers');
    var reset = button('استعادة القيم الافتراضية', 'btn-danger-ghost', function () { state.tiers = clone(DemoData.TIERS); state.pools = clone(DemoData.POOLS); state.options.roundingStep = 1; persistSettings(); recompute(); close(); render(); });
    modal.appendChild(el('div', 'settings-footer', [reset, button('حفظ الإعدادات', 'btn-primary', function () { persistSettings(); close(); render(); })]));
    backdrop.appendChild(modal); document.body.appendChild(backdrop);

    var previouslyFocused = document.activeElement;
    var previousOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    function focusables() {
      return Array.prototype.slice.call(modal.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(function (n) { return !n.disabled; });
    }
    function onKeydown(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'Tab') {
        var items = focusables();
        if (!items.length) return;
        var first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    function onBackdropClick(e) { if (e.target === backdrop) close(); }
    function close() {
      document.removeEventListener('keydown', onKeydown, true);
      backdrop.removeEventListener('mousedown', onBackdropClick);
      document.body.style.overflow = previousOverflow;
      if (backdrop.parentNode) backdrop.remove();
      if (previouslyFocused && typeof previouslyFocused.focus === 'function') previouslyFocused.focus();
    }
    document.addEventListener('keydown', onKeydown, true);
    backdrop.addEventListener('mousedown', onBackdropClick);
    var firstFocusable = focusables()[0];
    if (firstFocusable) firstFocusable.focus();
  }
  function persistSettings() { try { localStorage.setItem('incentiveSettings', JSON.stringify({ tiers: state.tiers, pools: state.pools, roundingStep: state.options.roundingStep })); } catch (e) {} }

  function conservationCheck() {
    if (!state.result || !state.result.ok) return { ok: false, expected: 0, actual: 0 };
    var expected = 0;
    Object.keys(state.result.poolResults).forEach(function (n) { expected += state.result.poolResults[n].effectiveGrossPiastres; });
    var actual = state.result.people.reduce(function (s, r) { return s + r.grossPiastres; }, 0);
    return { ok: expected === actual, expected: expected, actual: actual };
  }

  function buildExport() {
    var fragment = document.createDocumentFragment();
    fragment.appendChild(heading('التصدير', 'أنشئ ملفًا قابلًا للمراجعة أو احفظ المشروع لتفتحه لاحقًا.'));
    var grid = el('div', 'export-grid');

    var exportCard = el('div', 'card');
    exportCard.appendChild(el('div', 'section-label', ['ملف التقرير']));
    exportCard.appendChild(el('div', 'export-list', [
      el('div', null, ['اسم الملف: ' + state.title + ' - ' + state.period]),
      el('div', null, ['الأوراق: الملخص التنفيذي، المنهجية، التفصيل الكامل، مجمعات الأموال، الحالات الخاصة']),
      el('div', null, ['يشمل كامل السكان: ' + state.people.length + ' صفًا — الفلاتر لا تغيّر الإجماليات'])
    ]));
    var exportBtn = el('button', 'btn btn-primary', [iconEl('download'), 'تنزيل تقرير Excel']);
    exportBtn.type = 'button';
    exportBtn.addEventListener('click', exportReport);
    exportCard.appendChild(exportBtn);
    grid.appendChild(exportCard);

    var projectCard = el('div', 'card');
    projectCard.appendChild(el('div', 'section-label', ['حفظ واستعادة']));
    projectCard.appendChild(el('div', 'export-list', [el('div', null, ['حفظ كل البيانات والإعدادات والتعديلات في JSON'])]));
    var restoreInput = el('input', 'sr-only'); restoreInput.type = 'file'; restoreInput.accept = '.json';
    restoreInput.addEventListener('change', function () { if (restoreInput.files[0]) loadProject(restoreInput.files[0]); });
    var projectActions = el('div', 'project-actions');
    projectActions.appendChild(button('حفظ المشروع', 'btn-ghost', saveProject));
    projectActions.appendChild(button('استعادة من ملف', 'btn-ghost', function () { restoreInput.click(); }));
    projectActions.appendChild(restoreInput);
    projectCard.appendChild(projectActions);
    grid.appendChild(projectCard);
    fragment.appendChild(grid);

    var checks = el('div', 'card');
    checks.appendChild(el('div', 'section-label', ['قبل التسليم']));
    var check = conservationCheck();
    checks.appendChild(noticeEl(check.ok ? 'success' : 'danger', (check.ok ? [] : [iconEl('alert')]).concat([
      check.ok
        ? 'تحقق الحفظ: مجموع الإجماليات يساوي مبالغ المجمعات بالقرش بالضبط.'
        : 'تحقق الحفظ: فرق ' + formatEGP(Engine.fromPiastres(check.actual - check.expected), 2) + ' جنيه — راجع النتائج قبل التصدير.'
    ])));
    var warnings = (state.result && state.result.warnings) || [];
    if (warnings.length) {
      checks.appendChild(el('div', 'section-label', ['تنبيهات على مستوى الصفوف (' + warnings.length + ')']));
      var list = el('div', 'validation-list');
      warnings.slice(0, 20).forEach(function (w) { list.appendChild(el('div', 'validation-item', [el('span', null, [w.message])])); });
      if (warnings.length > 20) list.appendChild(el('div', 'validation-item', [el('span', null, ['و' + (warnings.length - 20) + ' تنبيهًا آخر'])]));
      checks.appendChild(list);
    }
    fragment.appendChild(checks);

    var actions = el('div', 'step-actions');
    actions.appendChild(button('لوحة المعلومات', 'btn-ghost', function () { state.screen = 4; render(); }));
    actions.appendChild(button('بدء مشروع جديد', 'btn-danger-ghost', function () { state = makeInitialState(); render(); }));
    fragment.appendChild(actions);
    return fragment;
  }

  function captureFocus() {
    var a = document.activeElement;
    if (!a || !a.id) return null;
    var snap = { id: a.id };
    if (typeof a.selectionStart === 'number') { snap.start = a.selectionStart; snap.end = a.selectionEnd; }
    return snap;
  }

  function restoreFocus(snap) {
    if (!snap) return;
    var n = document.getElementById(snap.id);
    if (!n) return;
    n.focus();
    if (snap.start != null && typeof n.setSelectionRange === 'function') {
      try { n.setSelectionRange(snap.start, snap.end); } catch (e) {}
    }
  }

  function capturePageState() {
    var snap = { focus: captureFocus(), scrollY: window.scrollY, tableScroll: {} };
    document.querySelectorAll('[data-scroll-key]').forEach(function (n) { snap.tableScroll[n.getAttribute('data-scroll-key')] = n.scrollTop; });
    return snap;
  }

  function restorePageState(snap) {
    if (!snap) return;
    restoreFocus(snap.focus);
    window.scrollTo(0, snap.scrollY || 0);
    document.querySelectorAll('[data-scroll-key]').forEach(function (n) {
      var key = n.getAttribute('data-scroll-key');
      if (snap.tableScroll && snap.tableScroll[key] != null) n.scrollTop = snap.tableScroll[key];
    });
  }

  function loadFailureNotice() {
    var messages = [];
    if (window.__fontLoadFailed) messages.push('تعذر تحميل الخط العربي المخصص من الإنترنت — يُستخدم خط بديل من نظام التشغيل.');
    if (window.__sheetJsLoadFailed) messages.push('تعذر تحميل محرك ملفات Excel — سيُستخدم تنسيق CSV عند التصدير بدلاً من xlsx.');
    if (!messages.length) return null;
    return el('div', 'notice', [messages.join(' ')]);
  }

  function render() { closeOpenDropdown(); var snap = capturePageState(); container.innerHTML = ''; var pageCls = 'page' + (state.screen === 4 ? ' page-dashboard' : '') + (state.screen <= 2 ? ' page-narrow' : ''); var page = el('main', pageCls); page.appendChild(header()); page.appendChild(buildStepper()); var content = state.screen === 0 ? buildUpload() : (state.screen === 1 ? buildMapping() : (state.screen === 2 ? buildAmounts() : (state.screen === 3 ? buildAllocation() : (state.screen === 4 ? buildDashboard() : buildExport())))); var stack = el('div', 'screen-stack'); var loadNotice = loadFailureNotice(); if (loadNotice) stack.appendChild(loadNotice); stack.appendChild(content); page.appendChild(stack); container.appendChild(page); restorePageState(snap); }
  function boot(target) { container = target; state = makeInitialState(); try { state.tierMappings = JSON.parse(localStorage.getItem('tierMappings') || '{}'); } catch (e) { state.tierMappings = {}; } render(); }
  return {
    boot: boot,
    showToast: showToast,
    version: APP_VERSION,
    internals: {
      getState: function () { return state; },
      setState: function (next) { state = next; },
      recompute: recompute,
      filteredPeople: filteredPeople,
      detailRows: detailRows,
      executiveRows: executiveRows,
      specialCasePeople: specialCasePeople,
      exportReport: exportReport,
      conservationCheck: conservationCheck,
      resultIndex: resultIndex,
      isSpecial: isSpecial
    }
  };
})();

</script>
<script>
(function boot() {
  var params = new URLSearchParams(window.location.search);
  var app = document.getElementById('app');
  if (params.get('selftest') === '1') {
    SelfTest.renderInto(app);
    return;
  }
  App.boot(app);
})();
</script>
